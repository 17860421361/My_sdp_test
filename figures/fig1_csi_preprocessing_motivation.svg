<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="740" viewBox="0 0 1800 740" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Why configurable CSI preprocessing must be evaluated</title>
  <desc id="fig-desc">An editable four-panel publication figure. Raw CSI mixes motion information, phase drift, and noise. Operators impose different priors. Processing can retain or attenuate a fast motion signature. The same model and split can therefore produce different measured outcomes.</desc>
  <defs>
    <style>
      .panel-label { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 700; fill: #111111; }
      .panel-title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #111111; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #222222; }
      .body-sm { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #30343a; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #4d545c; }
      .italic { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-style: italic; fill: #4d545c; }
      .axis { stroke: #40464d; stroke-width: 1.4; }
      .grid { stroke: #d8dde3; stroke-width: 1; stroke-dasharray: 3.5 4; }
      .divider { stroke: #d2d6db; stroke-width: 1.3; }
      .frame { fill: #fbfcfd; stroke: #c7cdd4; stroke-width: 1.2; }
      .block { fill: #eef4fa; stroke: #3775ba; stroke-width: 1.6; }
      .control { fill: #f0f2f4; stroke: #767e87; stroke-width: 1.4; }
      .good { fill: #edf7ed; stroke: #4f9161; stroke-width: 1.6; }
      .bad { fill: #fbeeee; stroke: #b64342; stroke-width: 1.6; }
      .main-arrow { fill: none; stroke: #555b62; stroke-width: 2; marker-end: url(#arrow-gray); }
      .thin-arrow { fill: none; stroke: #656d75; stroke-width: 1.4; marker-end: url(#arrow-gray); }
      .green-arrow { fill: none; stroke: #4f9161; stroke-width: 2; marker-end: url(#arrow-green); }
      .red-arrow { fill: none; stroke: #b64342; stroke-width: 2; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555b62"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f9161"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b64342"/>
    </marker>
    <clipPath id="a-wave-clip"><rect x="58" y="118" width="335" height="213"/></clipPath>
  </defs>

  <!-- panel guides: intentionally subtle so the figure remains open and paper-like -->
  <line class="divider" x1="445" y1="44" x2="445" y2="646"/>
  <line class="divider" x1="900" y1="44" x2="900" y2="646"/>
  <line class="divider" x1="1335" y1="44" x2="1335" y2="646"/>

  <!-- (a) Raw CSI -->
  <g id="panel-a">
    <text class="panel-label" x="48" y="63">a</text>
    <text class="panel-title" x="80" y="63">Raw CSI contains mixed information</text>
    <rect class="frame" x="58" y="95" width="335" height="238"/>
    <text class="small" x="74" y="116">amplitude, representative subcarrier</text>
    <line class="axis" x1="78" y1="299" x2="369" y2="299"/>
    <line class="axis" x1="78" y1="134" x2="78" y2="299"/>
    <line class="grid" x1="78" y1="174" x2="369" y2="174"/>
    <line class="grid" x1="78" y1="216" x2="369" y2="216"/>
    <line class="grid" x1="78" y1="258" x2="369" y2="258"/>
    <text class="small" x="208" y="320">time</text>
    <text class="small" x="53" y="235" transform="rotate(-90 53,235)">CSI</text>
    <rect x="194" y="132" width="82" height="167" fill="#f6cfcB" opacity="0.62"/>
    <g clip-path="url(#a-wave-clip)">
      <path d="M78 266 C94 258 111 261 126 254 C142 247 158 251 174 242 C188 235 198 238 207 249 C215 262 221 214 230 257 C239 300 247 206 257 254 C267 292 275 214 284 245 C294 271 305 227 316 236 C333 236 349 221 369 216" fill="none" stroke="#2d3339" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M78 273 C136 260 194 244 247 244 C294 241 332 230 369 216" fill="none" stroke="#3775ba" stroke-width="1.8" stroke-dasharray="6 4"/>
    </g>
    <circle cx="329" cy="270" r="5.2" fill="#b64342"/>
    <path d="M288 154 L265 228" class="thin-arrow"/>
    <text class="body-sm" x="285" y="145">fast motion</text>
    <path d="M353 259 L333 269" class="thin-arrow"/>
    <text class="body-sm" x="277" y="286" fill="#b64342">impulse</text>

    <!-- phase inset -->
    <rect class="frame" x="58" y="360" width="335" height="70"/>
    <text class="small" x="74" y="382">measured phase</text>
    <path d="M100 415 L137 409 L170 403 L204 395 L237 388 L273 381 L350 369" fill="none" stroke="#7b5b97" stroke-width="2.5"/>
    <path d="M292 403 L265 387" class="thin-arrow"/>
    <text class="body-sm" x="217" y="421">phase drift</text>

    <line x1="63" y1="473" x2="92" y2="473" stroke="#d27a21" stroke-width="4"/>
    <text class="body" x="103" y="480">motion-related dynamics</text>
    <line x1="63" y1="512" x2="92" y2="512" stroke="#7b5b97" stroke-width="4"/>
    <text class="body" x="103" y="519">hardware phase variation</text>
    <line x1="63" y1="551" x2="92" y2="551" stroke="#b64342" stroke-width="4"/>
    <text class="body" x="103" y="558">measurement noise / outlier</text>
  </g>

  <!-- (b) Operator priors -->
  <g id="panel-b">
    <text class="panel-label" x="477" y="63">b</text>
    <text class="panel-title" x="509" y="63">Different operators make different assumptions</text>
    <polygon points="511,105 653,105 669,126 527,126" class="control"/>
    <text class="body" x="554" y="124">raw CSI</text>
    <path class="main-arrow" d="M591 131 L591 162"/>
    <text class="small" x="525" y="155">configurable operator set</text>

    <!-- five configuration options use one common input but no imposed serial order -->
    <path d="M591 170 L591 194 L527 194 L527 210" class="thin-arrow"/>
    <path d="M591 170 L591 194 L756 194 L756 210" class="thin-arrow"/>
    <path d="M591 170 L591 326 L527 326 L527 342" class="thin-arrow"/>
    <path d="M591 170 L591 326 L756 326 L756 342" class="thin-arrow"/>
    <path d="M591 170 L591 458" class="thin-arrow"/>

    <rect class="block" x="478" y="212" width="177" height="89"/>
    <text class="body" x="516" y="242">Denoising</text>
    <text class="small" x="507" y="272">smoothness prior</text>

    <rect class="block" x="678" y="212" width="177" height="89"/>
    <text class="body" x="698" y="242">Outlier repair</text>
    <text class="small" x="689" y="272">local-continuity prior</text>

    <rect class="block" x="478" y="344" width="177" height="89"/>
    <text class="body" x="490" y="374">Phase calibration</text>
    <text class="small" x="500" y="404">hardware-phase prior*</text>

    <rect class="block" x="678" y="344" width="177" height="89"/>
    <text class="body" x="704" y="374">Normalization</text>
    <text class="small" x="696" y="404">scale-invariance prior</text>

    <rect class="block" x="578" y="476" width="177" height="89"/>
    <text class="body" x="599" y="506">Interpolation</text>
    <text class="small" x="600" y="536">grid-alignment prior</text>

    <text class="italic" x="480" y="608">* applicable to complex CSI only</text>
  </g>

  <!-- (c) information consequence -->
  <g id="panel-c">
    <text class="panel-label" x="932" y="63">c</text>
    <text class="panel-title" x="964" y="63">Preprocessing can preserve or remove information</text>
    <text class="body-sm" x="944" y="106">same local CSI segment</text>
    <rect class="frame" x="944" y="120" width="335" height="78"/>
    <line class="axis" x1="961" y1="177" x2="1264" y2="177"/>
    <rect x="1057" y="125" width="72" height="52" fill="#f6cfcB" opacity="0.75"/>
    <path d="M961 160 C979 156 993 163 1009 158 C1025 153 1039 162 1053 157 C1062 144 1070 186 1079 141 C1088 191 1097 141 1107 157 C1120 164 1138 151 1154 157 C1186 158 1222 147 1264 150" fill="none" stroke="#2d3339" stroke-width="3"/>
    <text class="small" x="1062" y="144" fill="#9d5b17">rapid variation</text>

    <path d="M1110 202 L1110 226 L974 226 L974 242" class="green-arrow"/>
    <path d="M1110 202 L1110 414 L974 414 L974 430" class="red-arrow"/>

    <rect class="good" x="944" y="244" width="335" height="129"/>
    <text class="body" x="965" y="274" fill="#2f7643">Matched prior</text>
    <text class="body-sm" x="965" y="299">task-relevant transient is retained</text>
    <line class="axis" x1="966" y1="347" x2="1257" y2="347"/>
    <path d="M966 331 C992 326 1011 334 1028 328 C1047 323 1065 333 1080 326 C1088 307 1096 356 1106 299 C1116 357 1127 301 1139 326 C1155 333 1177 318 1195 324 C1215 329 1236 318 1257 321" fill="none" stroke="#4f9161" stroke-width="3.2"/>
    <path d="M1011 350 L1020 359 L1037 338" fill="none" stroke="#4f9161" stroke-width="3"/>

    <rect class="bad" x="944" y="432" width="335" height="129"/>
    <text class="body" x="965" y="462" fill="#a33232">Mismatched prior</text>
    <text class="body-sm" x="965" y="487">task-relevant transient is attenuated</text>
    <line class="axis" x1="966" y1="535" x2="1257" y2="535"/>
    <path d="M966 520 C996 516 1025 521 1051 516 C1080 513 1108 518 1136 513 C1163 511 1192 516 1221 511 C1234 511 1247 510 1257 509" fill="none" stroke="#b64342" stroke-width="3.2"/>
    <path d="M1091 499 L1110 520 M1110 499 L1091 520" stroke="#b64342" stroke-width="2.8"/>
  </g>

  <!-- (d) Evaluation consequence -->
  <g id="panel-d">
    <text class="panel-label" x="1367" y="63">d</text>
    <text class="panel-title" x="1399" y="63">Same model, different conclusion</text>
    <rect class="control" x="1380" y="94" width="338" height="62"/>
    <text class="body" x="1450" y="122">fixed model M and split S</text>
    <text class="small" x="1482" y="145">only pipeline changes</text>

    <!-- experiment A -->
    <rect class="good" x="1378" y="207" width="104" height="76"/>
    <text class="body" x="1405" y="240" fill="#2f7643">P<tspan baseline-shift="sub" font-size="15">A</tspan></text>
    <text class="small" x="1393" y="265">matched</text>
    <path class="green-arrow" d="M1484 245 L1534 245"/>
    <rect class="block" x="1538" y="207" width="84" height="76"/>
    <text class="body" x="1568" y="242">M</text>
    <text class="small" x="1550" y="265">same M</text>
    <path class="green-arrow" d="M1624 245 L1650 245"/>
    <rect class="frame" x="1655" y="207" width="72" height="76"/>
    <line class="axis" x1="1665" y1="266" x2="1717" y2="266"/>
    <rect x="1672" y="227" width="14" height="39" fill="#4f9161"/>
    <rect x="1697" y="218" width="14" height="48" fill="#3775ba"/>
    <text class="small" x="1655" y="302">higher score</text>

    <!-- experiment B -->
    <rect class="bad" x="1378" y="390" width="104" height="76"/>
    <text class="body" x="1405" y="423" fill="#a33232">P<tspan baseline-shift="sub" font-size="15">B</tspan></text>
    <text class="small" x="1385" y="448">mismatched</text>
    <path class="red-arrow" d="M1484 428 L1534 428"/>
    <rect class="block" x="1538" y="390" width="84" height="76"/>
    <text class="body" x="1568" y="425">M</text>
    <text class="small" x="1550" y="448">same M</text>
    <path class="red-arrow" d="M1624 428 L1650 428"/>
    <rect class="frame" x="1655" y="390" width="72" height="76"/>
    <line class="axis" x1="1665" y1="449" x2="1717" y2="449"/>
    <rect x="1672" y="431" width="14" height="18" fill="#b64342"/>
    <rect x="1697" y="437" width="14" height="12" fill="#cfcECE"/>
    <text class="small" x="1656" y="485">lower score</text>

    <line x1="1378" y1="334" x2="1728" y2="334" stroke="#d2d6db" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="1380" y="536" width="338" height="56" fill="#fff8e8" stroke="#d18a26" stroke-width="1.4"/>
    <text class="body-sm" x="1416" y="560">Preprocessing changes the input</text>
    <text class="body-sm" x="1432" y="582">and may change the conclusion.</text>
  </g>

  <!-- narrative arrows between panels -->
  <path class="main-arrow" d="M415 620 L438 620"/>
  <path class="main-arrow" d="M870 620 L893 620"/>
  <path class="main-arrow" d="M1305 620 L1328 620"/>
  <text class="italic" x="52" y="684">Motivation: evaluate preprocessing as a configurable and data-dependent component of the CSI sensing pipeline.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">Motivation for configurable WiFi CSI preprocessing</title>
  <desc id="desc">Four aligned panels show mixed raw CSI, configurable preprocessing operators, information preserved or distorted by different processing, and different conclusions from the same downstream model.</desc>
  <defs>
    <style>
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #202428; }
      .head-sm { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #202428; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #252a2f; }
      .body-sm { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #3c444c; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #3c444c; }
      .axis { stroke: #263039; stroke-width: 1.8; }
      .grid { stroke: #d9dde2; stroke-width: 1.1; stroke-dasharray: 4 5; }
      .connector { fill: none; stroke: #2b3137; stroke-width: 2.1; marker-end: url(#arrow-black); }
      .connector-thin { fill: none; stroke: #626c76; stroke-width: 1.5; marker-end: url(#arrow-gray); }
      .blue-box { fill: #ffffff; stroke: #4f9eae; stroke-width: 2.3; }
      .green-box { fill: #fcfffd; stroke: #7abb86; stroke-width: 2.2; }
      .orange-box { fill: #fffefd; stroke: #efa65b; stroke-width: 2.2; }
      .red-box { fill: #fffdfd; stroke: #e78686; stroke-width: 2.2; }
      .model-box { fill: #ffffff; stroke: #7f8a96; stroke-width: 2.1; }
      .green-text { fill: #4f9161; } .orange-text { fill: #d5822d; }
      .red-text { fill: #bd5151; } .blue-text { fill: #2e6ead; }
    </style>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2b3137"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#626c76"/>
    </marker>
  </defs>

  <!-- (a) Mixed raw CSI -->
  <g id="panel-a">
    <text class="head blue-text" x="69" y="73">(a) Raw CSI contains</text>
    <text class="head blue-text" x="135" y="105">mixed variations</text>

    <text class="body-sm" x="58" y="235">CSI Amplitude</text>
    <text class="body-sm" x="58" y="258">(dB)</text>
    <line class="axis" x1="74" y1="624" x2="371" y2="624"/>
    <line class="axis" x1="74" y1="279" x2="74" y2="624"/>
    <line class="grid" x1="74" y1="354" x2="371" y2="354"/>
    <line class="grid" x1="74" y1="434" x2="371" y2="434"/>
    <line class="grid" x1="74" y1="514" x2="371" y2="514"/>
    <text class="body-sm" x="346" y="652">Time</text>
    <path d="M69 285 L74 277 L79 285" fill="#263039"/>
    <path d="M380 619 L372 624 L380 629" fill="#263039"/>

    <!-- raw amplitude: blue trace, orange drift, red impulse -->
    <path d="M74 540 C84 526 95 535 106 511 C115 488 125 510 134 477 C144 506 155 449 165 487 C174 452 185 509 196 481 C207 497 216 523 228 496 C239 481 248 500 257 478 C267 511 278 467 288 491 C300 511 310 473 322 488 C332 511 342 456 352 491 C360 505 365 477 371 484" fill="none" stroke="#3775ba" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M75 549 C129 526 181 505 234 486 C282 469 325 451 371 430" fill="none" stroke="#e59648" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M269 477 L274 326 L279 478" fill="none" stroke="#b64342" stroke-width="4"/>
    <circle cx="274" cy="326" r="6" fill="#b64342"/>

    <!-- annotations -->
    <text class="body-sm blue-text" x="100" y="403">Human-motion</text>
    <text class="body-sm blue-text" x="122" y="428">response</text>
    <path class="connector-thin" d="M167 433 L155 475"/>
    <text class="body-sm red-text" x="306" y="201">Impulsive</text>
    <text class="body-sm red-text" x="320" y="226">noise</text>
    <path class="connector-thin" d="M333 233 L279 322"/>
    <text class="body-sm orange-text" x="307" y="405">Hardware</text>
    <text class="body-sm orange-text" x="327" y="429">drift</text>
    <path class="connector-thin" d="M343 437 L337 450"/>

    <!-- sampling markers -->
    <circle cx="77" cy="624" r="4" fill="#263039"/><circle cx="111" cy="624" r="4" fill="#263039"/><circle cx="147" cy="624" r="4" fill="#263039"/>
    <circle cx="207" cy="624" r="4" fill="#263039"/><circle cx="251" cy="624" r="4" fill="#263039"/><circle cx="302" cy="624" r="4" fill="#263039"/><circle cx="355" cy="624" r="4" fill="#263039"/>
    <text class="body-sm" x="162" y="706" fill="#74518f">Sampling</text>
    <text class="body-sm" x="145" y="731" fill="#74518f">irregularity</text>
    <path class="connector-thin" d="M227 695 L251 634"/>

  </g>

  <!-- (b) Configurable pipeline -->
  <g id="panel-b">
    <text class="head" x="498" y="73" fill="#34816e">(b) Preprocessing imposes</text>
    <text class="head" x="549" y="105" fill="#34816e">assumptions</text>

    <text class="body" x="595" y="172">Raw CSI</text>
    <polygon points="554,189 740,189 760,213 574,213" fill="#f2f4f6" stroke="#707a84" stroke-width="1.8"/>
    <text class="body-sm" x="632" y="208">H(t,k)</text>
    <text class="note" x="547" y="153">example configurable pipeline</text>

    <rect class="blue-box" x="529" y="248" width="268" height="57" rx="7"/>
    <text class="body" x="608" y="285">Denoising</text>
    <path class="connector" d="M663 214 L663 244"/>
    <rect class="blue-box" x="529" y="344" width="268" height="57" rx="7"/>
    <text class="body" x="585" y="381">Outlier handling</text>
    <path class="connector" d="M663 307 L663 340"/>
    <rect class="blue-box" x="529" y="440" width="268" height="57" rx="7"/>
    <text class="body" x="581" y="477">Phase calibration</text>
    <path class="connector" d="M663 403 L663 436"/>
    <rect class="blue-box" x="529" y="536" width="268" height="57" rx="7"/>
    <text class="body" x="598" y="573">Normalization</text>
    <path class="connector" d="M663 499 L663 532"/>
    <rect class="blue-box" x="529" y="632" width="268" height="57" rx="7"/>
    <text class="body" x="606" y="669">Interpolation</text>
    <path class="connector" d="M663 595 L663 628"/>
    <path class="connector" d="M663 691 L663 720"/>

  </g>

  <!-- (c) Information consequence -->
  <g id="panel-c">
    <text class="head orange-text" x="922" y="73">(c) Different preprocessing</text>
    <text class="head orange-text" x="938" y="105">preserves different information</text>

    <!-- proper preprocessing -->
    <rect class="green-box" x="919" y="139" width="358" height="192" rx="8"/>
    <circle cx="946" cy="169" r="15" fill="#4f9161"/><text class="body-sm" x="941" y="176" fill="#ffffff">1</text>
    <text class="head-sm green-text" x="976" y="177">Proper preprocessing</text>
    <line class="axis" x1="981" y1="270" x2="1239" y2="270"/>
    <line class="axis" x1="981" y1="207" x2="981" y2="270"/>
    <text class="note" x="929" y="224">|CSI|</text>
    <path d="M994 252 L1007 239 L1021 246 L1035 218 L1049 253 L1063 230 L1077 243 L1091 208 L1105 246 L1119 234 L1133 252 L1148 219 L1162 245 L1177 231 L1192 249" fill="none" stroke="#3775ba" stroke-width="3.2"/>
    <text class="note" x="1206" y="289">Time</text>
    <text class="note" x="977" y="304">Noise reduced, motion</text>
    <text class="note" x="1000" y="323">structure preserved.</text>

    <!-- over-processing -->
    <rect class="orange-box" x="919" y="357" width="358" height="192" rx="8"/>
    <circle cx="946" cy="387" r="15" fill="#e59648"/><text class="body-sm" x="941" y="394" fill="#ffffff">2</text>
    <text class="head-sm orange-text" x="976" y="395">Over-processing</text>
    <line class="axis" x1="981" y1="488" x2="1239" y2="488"/>
    <line class="axis" x1="981" y1="425" x2="981" y2="488"/>
    <text class="note" x="929" y="442">|CSI|</text>
    <path d="M994 467 C1013 453 1033 476 1052 461 C1074 447 1095 470 1115 457 C1137 445 1159 466 1195 457" fill="none" stroke="#78a4de" stroke-width="3.2"/>
    <text class="note" x="1206" y="507">Time</text>
    <text class="note" x="965" y="522">Motion peaks weakened</text>
    <text class="note" x="988" y="541">or removed.</text>

    <!-- semantic/phase distortion -->
    <rect class="red-box" x="919" y="575" width="358" height="192" rx="8"/>
    <circle cx="946" cy="605" r="15" fill="#b64342"/><text class="body-sm" x="941" y="612" fill="#ffffff">3</text>
    <text class="head-sm red-text" x="976" y="613">Phase distortion</text>
    <text class="body-sm" x="962" y="657">φ<tspan baseline-shift="sub" font-size="13">meas</tspan>(t,k) = φ<tspan baseline-shift="sub" font-size="13">motion</tspan>(t,k) + φ<tspan baseline-shift="sub" font-size="13">hw</tspan>(t,k)</text>
    <path class="connector" d="M1090 674 L1090 699"/>
    <text class="body-sm" x="1012" y="729">calibration may alter a</text>
    <text class="body-sm" x="981" y="751">phase-related sensing cue.</text>
  </g>

  <!-- (d) Same model, different conclusion -->
  <g id="panel-d">
    <text class="head blue-text" x="1370" y="73">(d) Same model, different</text>
    <text class="head blue-text" x="1432" y="105">conclusions</text>

    <!-- three representations -->
    <rect class="green-box" x="1367" y="175" width="98" height="74" rx="7"/>
    <path d="M1379 221 L1389 205 L1400 217 L1410 190 L1420 222 L1430 207 L1440 218 L1451 196" fill="none" stroke="#3775ba" stroke-width="2.8"/>
    <rect class="orange-box" x="1367" y="373" width="98" height="74" rx="7"/>
    <path d="M1379 418 C1391 404 1401 427 1412 412 C1424 399 1437 421 1451 408" fill="none" stroke="#78a4de" stroke-width="2.8"/>
    <rect class="red-box" x="1367" y="571" width="98" height="74" rx="7"/>
    <path d="M1379 614 C1392 607 1404 619 1415 612 C1427 604 1438 617 1451 609" fill="none" stroke="#78a4de" stroke-width="2.8"/>

    <!-- same model -->
    <rect class="model-box" x="1519" y="310" width="121" height="250" rx="9"/>
    <text class="body-sm" x="1539" y="344">Same</text>
    <text class="body-sm" x="1529" y="367">downstream</text>
    <text class="body-sm" x="1550" y="390">model</text>
    <circle cx="1545" cy="447" r="7" fill="#f1f3f5" stroke="#65717d" stroke-width="1.4"/>
    <circle cx="1545" cy="482" r="7" fill="#f1f3f5" stroke="#65717d" stroke-width="1.4"/>
    <circle cx="1584" cy="426" r="7" fill="#f1f3f5" stroke="#65717d" stroke-width="1.4"/>
    <circle cx="1584" cy="464" r="7" fill="#f1f3f5" stroke="#65717d" stroke-width="1.4"/>
    <circle cx="1584" cy="502" r="7" fill="#f1f3f5" stroke="#65717d" stroke-width="1.4"/>
    <path d="M1552 447 L1577 426 M1552 447 L1577 464 M1552 482 L1577 464 M1552 482 L1577 502" stroke="#65717d" stroke-width="1.2"/>

    <!-- inputs join same model -->
    <path class="connector" d="M1467 212 L1490 212 L1490 392 L1515 392"/>
    <path class="connector" d="M1467 410 L1515 410"/>
    <path class="connector" d="M1467 608 L1490 608 L1490 518 L1515 518"/>

    <!-- score output -->
    <path class="connector" d="M1642 435 L1661 435 L1661 255 L1680 255"/>
    <path class="connector" d="M1642 435 L1661 435 L1661 452 L1680 452"/>
    <path class="connector" d="M1642 435 L1661 435 L1661 649 L1680 649"/>
    <rect class="green-box" x="1684" y="224" width="58" height="61" rx="7"/>
    <text class="body-sm green-text" x="1694" y="261">High</text>
    <rect class="orange-box" x="1684" y="421" width="58" height="61" rx="7"/>
    <text class="body-sm orange-text" x="1688" y="458">Med.</text>
    <rect class="red-box" x="1684" y="618" width="58" height="61" rx="7"/>
    <text class="body-sm red-text" x="1695" y="655">Low</text>

  </g>
</svg>
